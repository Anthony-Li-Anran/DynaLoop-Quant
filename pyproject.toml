[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaloop-quant"
version = "0.1.0"
description = "A reproducible framework for autonomous quantitative research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "filelock>=3.16,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
    "pandas>=2.0",
    "ta>=0.11",
    "deap>=1.4",
    "gplearn>=0.4.2",
    "arch>=7",
    "statsmodels>=0.14",
    "scipy>=1.11",
    # Local Qlib-structured learned-factor workflow (no pyqlib dependency).
    "lightgbm>=4.0",
    # Public alternative-data layer: A-share bars + news/sentiment providers.
    # Network access is optional; every provider degrades to explicit unavailable.
    "baostock>=0.8.9",
    "akshare>=1.14",
]

[project.optional-dependencies]
brain = ["torch>=2.6,<3", "scikit-learn>=1.4,<2"]
test = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dynaloop*"]
